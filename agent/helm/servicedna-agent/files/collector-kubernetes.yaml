# Kubernetes additions, merged over collector.yaml by the Helm chart (the collector merges
# multiple --config files; lists such as the pipeline's processors are replaced, not appended).
processors:
  # Tags each span with the pod, deployment, namespace and node it came from.
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.pod.name
        - k8s.node.name
    pod_association:
      - sources: [{from: resource_attribute, name: k8s.pod.ip}]
      - sources: [{from: connection}]

  # Workloads that don't set OTEL_SERVICE_NAME report "unknown_service:…"; name them after their
  # Deployment/StatefulSet/DaemonSet so they still register as services.
  transform/k8s-service-name:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], attributes["k8s.deployment.name"]) where (attributes["service.name"] == nil or IsMatch(attributes["service.name"], "^unknown_service")) and attributes["k8s.deployment.name"] != nil
          - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where (attributes["service.name"] == nil or IsMatch(attributes["service.name"], "^unknown_service")) and attributes["k8s.statefulset.name"] != nil
          - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where (attributes["service.name"] == nil or IsMatch(attributes["service.name"], "^unknown_service")) and attributes["k8s.daemonset.name"] != nil

service:
  pipelines:
    traces:
      processors: [memory_limiter, k8sattributes, transform/k8s-service-name, resource/environment, transform/mask, batch]
