version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: servicedna-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-servicedna}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: servicedna-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: servicedna-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: servicedna-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      # The internal listener is always 29092; the host-facing one moves with KAFKA_PORT.
      test: ["CMD", "nc", "-z", "localhost", "29092"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:3
    container_name: servicedna-zipkin
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: servicedna-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"

  loki:
    image: grafana/loki:3.3.2
    container_name: servicedna-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: servicedna-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      SERVICEDNA_OTLP_ENDPOINT: http://backend:8080/api/v1/otlp
    depends_on:
      - backend
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${ZIPKIN_INGEST_PORT:-9412}:9411"

  backend:
    build: ./backend
    container_name: servicedna-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-servicedna}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — see backend/.env.example}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-dummy-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-dummy-secret}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Without SMTP, print verification/reset emails to the log (local development only).
      MAIL_LOG_UNSENT: ${MAIL_LOG_UNSENT:-true}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-}
      BILLING_ENFORCE_PLAN_LIMITS: ${BILLING_ENFORCE_PLAN_LIMITS:-true}
      TRACE_STORE_OTLP_URL: ${TRACE_STORE_OTLP_URL:-http://tempo:4318}
      TRACE_STORE_QUERY_URL: ${TRACE_STORE_QUERY_URL:-http://tempo:3200}
      LOG_STORE_URL: ${LOG_STORE_URL:-http://loki:3100}
      RUNNER_SHARED_TOKEN: ${RUNNER_SHARED_TOKEN:-}

  # Test Studio runner for single-host setups, serving every organization on this ServiceDNA
# (docker compose --profile runner up). Runners in other networks use an ingestion key instead.
  runner:
    profiles: ["runner"]
    build: ./runner
    container_name: servicedna-runner
    depends_on:
      - backend
    environment:
      SERVICEDNA_URL: http://backend:8080
      RUNNER_SHARED_TOKEN: ${RUNNER_SHARED_TOKEN:-} # required when using this profile
      RUNNER_NAME: bundled
      KAFKA_BROKERS: ${RUNNER_KAFKA_BROKERS:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_AUTH_LOGIN_URL: ${VITE_AUTH_LOGIN_URL:-http://localhost:8080/oauth2/authorization/github}
        VITE_SSO_LOGIN_URL: ${VITE_SSO_LOGIN_URL:-http://localhost:8080/oauth2/authorization/oidc}
    container_name: servicedna-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
  tempodata:
  lokidata:
