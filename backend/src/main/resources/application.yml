spring:
  application:
    name: ServiceDNA
    
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/servicedna}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: servicedna-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Without this, a send() blocks for the default 60s when the broker is unreachable,
      # turning any Kafka blip into a request-thread hang on every code path that publishes
      # an event synchronously (e.g. the ping ingestion endpoint).
      properties:
        max.block.ms: 5000

server:
  port: ${PORT:8080}
  # Resolves the real client IP from X-Forwarded-For via Tomcat's RemoteIpValve, but only when
  # the direct connection comes from a trusted proxy (Tomcat's default internal-proxies pattern:
  # loopback and RFC1918 private ranges) — an internet client can't spoof this by setting the
  # header itself, unlike parsing it manually in application code.
  forward-headers-strategy: native

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

mail:
  from: ${MAIL_FROM:no-reply@servicedna.local}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      # Mail delivery is intentionally best-effort (MailService logs and continues on failure)
      # and optional until SMTP_* is configured — it shouldn't fail the app's overall health.
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  datadog:
    metrics:
      export:
        enabled: ${DATADOG_ENABLED:false}
        api-key: ${DATADOG_API_KEY:dummy}
        step: 1m
  newrelic:
    metrics:
      export:
        enabled: ${NEW_RELIC_ENABLED:false}
        api-key: ${NEW_RELIC_API_KEY:dummy}
        account-id: ${NEW_RELIC_ACCOUNT_ID:dummy}
        step: 1m

jwt:
  secret: ${JWT_SECRET:a-very-long-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-algorithm}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_123}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_123}
  price-id:
    pro: ${STRIPE_PRO_PRICE_ID:price_123}
    enterprise: ${STRIPE_ENTERPRISE_PRICE_ID:price_456}
