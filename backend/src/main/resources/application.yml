spring:
  application:
    name: ServiceDNA
  
  datasource:
    url: jdbc:postgresql://localhost:5433/servicedna
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    
  data:
    redis:
      port: 6380
      host: localhost

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: servicedna-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: a-very-long-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-algorithm
  expirationMs: 86400000

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_123}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_123}
  price-id:
    pro: ${STRIPE_PRO_PRICE_ID:price_123}
    enterprise: ${STRIPE_ENTERPRISE_PRICE_ID:price_456}
