spring:
  application:
    name: ServiceDNA
    
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/servicedna}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: servicedna-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${PORT:8080}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  datadog:
    metrics:
      export:
        enabled: ${DATADOG_ENABLED:false}
        api-key: ${DATADOG_API_KEY:dummy}
        step: 1m
  newrelic:
    metrics:
      export:
        enabled: ${NEW_RELIC_ENABLED:false}
        api-key: ${NEW_RELIC_API_KEY:dummy}
        account-id: ${NEW_RELIC_ACCOUNT_ID:dummy}
        step: 1m

jwt:
  secret: ${JWT_SECRET:a-very-long-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-algorithm}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_123}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_123}
  price-id:
    pro: ${STRIPE_PRO_PRICE_ID:price_123}
    enterprise: ${STRIPE_ENTERPRISE_PRICE_ID:price_456}
