spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        # application.yml pins PostgreSQLDialect via this more specific property, which would
        # otherwise win over database-platform and emit Postgres-only SQL (e.g. row-lock clauses).
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    producer:
      properties:
        # There's no Testcontainers Kafka wired up for tests (this sandbox's Docker API is too
        # old for Testcontainers to start any container at all), so spring.kafka.bootstrap-servers
        # falls through to whatever's on localhost:9092 — often an unrelated project's broker on
        # a shared dev machine, or nothing. Without this, KafkaProducer's default max.block.ms
        # (60s) makes any status-change test hang for a full minute before failing instead of
        # surfacing the real error quickly.
        max.block.ms: 3000
jwt:
  secret: a-very-long-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256-algorithm
  expirationMs: 86400000

stripe:
  api-key: sk_test_mock
  webhook-secret: whsec_mock
  price-id:
    pro: price_mock_pro
    enterprise: price_mock_ent

rate-limit:
  max-requests: 10000
graph:
  # Tests share Redis with a local docker-compose stack (port 6380); their own key namespace keeps
  # that stack's pairing sweep from claiming the tests' calls, and the tests from claiming its.
  pairing-key-prefix: "sdna:{pairing-test-${random.uuid}}:"
