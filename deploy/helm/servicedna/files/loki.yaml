# Grafana Loki: ServiceDNA's log store. Like Tempo, each organization is a tenant — the backend
# forwards OTLP logs with X-Scope-OrgID set to the organization id — so orgs' logs never mix.
auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP attributes (trace_id, span_id, severity, log attributes) are kept as structured metadata.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 720h # 30 days
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [deployment.environment.name]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
