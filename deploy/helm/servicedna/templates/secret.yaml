{{- if not .Values.secrets.existingSecret }}
{{- $name := include "servicedna.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := $existing.data | default dict }}
# Generated once and kept: upgrades reuse these values, and uninstalling leaves the Secret so a
# reinstall can still open the database.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "servicedna.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt-secret: {{ get $data "jwt-secret" | default (randAlphaNum 64 | b64enc) | quote }}
  database-password: {{ get $data "database-password" | default (randAlphaNum 32 | b64enc) | quote }}
  runner-token: {{ get $data "runner-token" | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
