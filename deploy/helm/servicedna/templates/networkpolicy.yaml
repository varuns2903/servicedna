{{- if .Values.networkPolicy.enabled }}
{{- range $component := list "postgresql" "redis" "kafka" "tempo" "loki" }}
{{- if (index $.Values $component).enabled }}
{{- $c := dict "root" $ "component" $component }}
---
# Only the backend (and the backup job) may reach {{ $component }}.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "servicedna.name" $c }}
  labels:
    {{- include "servicedna.labels" $c | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "servicedna.selectorLabels" $c | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "servicedna.selectorLabels" (dict "root" $ "component" "backend") | nindent 14 }}
        {{- if and (eq $component "postgresql") $.Values.backup.enabled }}
        - podSelector:
            matchLabels:
              {{- include "servicedna.selectorLabels" (dict "root" $ "component" "backup") | nindent 14 }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
