{{- if .Values.loki.enabled }}
{{- $c := dict "root" . "component" "loki" }}
{{- $name := include "servicedna.name" $c }}
# Grafana Loki, the log store: one tenant per organization.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "servicedna.labels" $c | nindent 4 }}
data:
  loki.yaml: |
    {{- .Files.Get "files/loki.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "servicedna.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "servicedna.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "servicedna.selectorLabels" $c | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/loki.yaml" | sha256sum }}
    spec:
      {{- include "servicedna.podSpec" (dict "root" . "uid" 10001) | nindent 6 }}
      containers:
        - name: loki
          image: {{ .Values.loki.image | quote }}
          args: [-config.file=/etc/loki/loki.yaml]
          {{- include "servicedna.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.loki.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.loki.storage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "servicedna.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "servicedna.selectorLabels" $c | nindent 4 }}
  ports:
    - {name: http, port: 3100, targetPort: http}
{{- end }}
