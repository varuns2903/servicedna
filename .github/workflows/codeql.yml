name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Catches newly published advisories against code that hasn't changed.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required to upload the SARIF results to the Security tab.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Java extractor needs to observe a real compile, hence build-mode: manual.
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Tests are skipped on purpose: CodeQL only needs the main sources compiled, and the
      # suite needs a Redis service this job deliberately doesn't run.
      - name: Compile backend
        if: matrix.build-mode == 'manual'
        working-directory: backend
        run: ./mvnw -B clean compile -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
