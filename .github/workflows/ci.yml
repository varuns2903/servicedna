name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A newer push to the same branch makes in-flight runs obsolete; cancel them rather than
# spending runners on a commit nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest

    services:
      # RateLimitInterceptor.preHandle() runs an INCR against Redis on every request that
      # isn't /actuator or /ws, so without a reachable Redis every MockMvc call in the suite
      # fails with a 500 — not just RateLimitInterceptorTest.
      # Published on 6380 (not 6379) to match the SPRING_DATA_REDIS_PORT default in
      # application.yml and the port docker-compose maps for local dev.
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6380

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B clean verify

      # Uploaded on failure too — the surefire XML is what makes a red build diagnosable
      # without re-running it locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Node 20 to match the builder stage in frontend/Dockerfile, so a green CI build means
      # the image build will compile too.
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` already runs `tsc -b`, but doing it as its own step attributes a type
      # error to type-checking instead of burying it in the bundler step.
      - name: Type check
        run: npx tsc -b --force

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # No point booting browsers if the bundle doesn't even compile.
    needs: frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run dev` itself via `webServer`. The specs only
      # exercise routing and render and every VITE_* var has a fallback in code, so no backend
      # and no .env file are needed here.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
